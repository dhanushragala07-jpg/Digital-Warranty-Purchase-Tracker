<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Organize purchases, keep invoice evidence together, and track warranty timelines.">
  <title>WarrantyHub — Digital Warranty & Purchase Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="WarrantyHub home"><span class="brand-mark">W</span><span>Warranty<span class="brand-light">Hub</span><small>Purchase intelligence</small></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span>▦</span> Overview</button>
        <button class="nav-item" data-view="purchases"><span>▤</span> My purchases</button>
        <button class="nav-item" data-view="warranties"><span>◷</span> Warranty timeline</button>
        <button class="nav-item" data-view="claims"><span>♧</span> Claims</button>
        <button class="nav-item" data-view="add"><span>＋</span> Add a purchase</button>
      </nav>
      <div class="sidebar-bottom"><div class="secure-icon">✓</div><strong>Your records, organized</strong><p>Keep purchase details and warranty dates in one place.</p><span class="demo-label">DEMO PREVIEW</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="menuToggle" aria-label="Toggle menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumbCurrent">Overview</strong></div><div class="top-actions"><span class="status-dot"></span><span class="demo-status">Demo mode</span><button class="avatar" title="Demo profile">DK</button></div></header>
      <section class="page-content" id="pageContent" aria-live="polite"></section>
      <footer>WarrantyHub <span>•</span> Digital Warranty & Purchase Tracker <span class="footer-right">Prototype · Sample data only</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
